<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Planur">
  <!-- Sage tile, not the navy of the supplied artwork. Owner, 2026-09-12, chose
       "logo only, keep sage and sky" over a full rebrand: the mark is new, the
       palette is not. Sage also matches the favicon this replaces, so a tab
       somebody already has open does not appear to change company overnight.
       For the navy version, this one fill is the only thing to change. -->
  <rect width="100" height="100" rx="22" fill="#4A7C59"/>
  
  <!-- Stylized Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Light Calendar Grid Background -->
    <rect x="35" y="10" width="42" height="42" rx="8" fill="#FFFFFF" opacity="0.08"/>
    
    <!-- Stylized 'P' Loop -->
    <path d="M 12 50 C 12 22, 28 10, 44 10 C 60 10, 68 22, 58 36 C 48 50, 24 50, 14 38 C 9 32, 12 20, 26 14 C 40 8, 54 18, 48 30" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Gold Highlight Accent -->
    <path d="M 14 38 C 24 50, 48 50, 58 36" 
          fill="none" 
          stroke="#D4AF37" 
          stroke-width="8" 
          stroke-linecap="round"/>
  </g>
</svg>
