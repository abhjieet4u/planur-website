<!DOCTYPE html>
<!--
  Planur — app download / store-redirect landing. Served at https://theplanur.co.uk/download
  Detects the visitor's platform and redirects to the matching store; shows buttons as a
  fallback (desktop, or if the redirect is blocked). Preserves ?ref= for install attribution.

  BEFORE PUBLIC LAUNCH, fill in:
    - {{APPSTORE_ID}} — the numeric Apple App Store ID (iOS listing isn't live yet).
  NOTE: while the app is on Play *internal testing* the Play listing is not public, so the
  redirect will 404 for non-testers — this page becomes fully live once the app is public.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Planur</title>
<meta name="robots" content="all">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234A7C59'/><text x='16' y='23' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='20' fill='white'>P</text></svg>" />
<style>
  @font-face{font-family:'DM Sans';font-style:normal;font-display:swap;font-weight:100 1000;
    src:url('/fonts/dm-sans-latin-opsz-normal.woff2') format('woff2-variations');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  :root{--sage:#4A7C59;--sage-faint:#EBF3EE;--neutral:#F8F9FA;--neutral-mid:#E9ECEF;
    --text-dark:#1A2B22;--text-mid:#4A5E52;--text-light:#8A9E92;--radius:18px;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text-dark);
    background:var(--neutral);min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:32px 22px;line-height:1.6;}
  .logo{font-size:2rem;font-weight:800;color:var(--sage);letter-spacing:-.5px;text-decoration:none;margin-bottom:8px;}
  h1{font-size:1.6rem;letter-spacing:-.4px;margin:.2em 0 .1em;}
  p{color:var(--text-mid);font-size:1rem;max-width:30em;margin:.4em 0 0;}
  .stores{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:28px;}
  .store-btn{display:inline-flex;align-items:center;gap:10px;background:var(--text-dark);color:#fff;
    text-decoration:none;padding:14px 22px;border-radius:var(--radius);font-weight:600;font-size:.98rem;}
  .store-btn.secondary{background:#fff;color:var(--text-dark);border:1px solid var(--neutral-mid);}
  .store-btn small{display:block;font-weight:400;font-size:.72rem;color:var(--text-light);}
  .note{margin-top:26px;font-size:.85rem;color:var(--text-light);}
  .note a{color:var(--sage);}
</style>
</head>
<body>
  <a class="logo" href="/">Planur</a>
  <h1>Get Planur</h1>
  <p id="lead">Your academic life, organised. Download Planur to get started.</p>

  <div class="stores">
    <a class="store-btn" id="play" href="#">Google Play <small>Android</small></a>
    <a class="store-btn secondary" id="appstore" href="#">App&nbsp;Store <small>iPhone &amp; iPad</small></a>
  </div>

  <p class="note">By continuing you agree to our <a href="/terms">Terms</a> and
    <a href="/privacy">Privacy Policy</a>.</p>

<script>
  (function () {
    var APPSTORE_ID = '{{APPSTORE_ID}}'; // TODO: fill the numeric Apple App Store ID at iOS launch
    var params = new URLSearchParams(location.search);
    var ref = params.get('ref');

    var play = 'https://play.google.com/store/apps/details?id=app.planur.student';
    if (ref) play += '&referrer=' + encodeURIComponent('ref=' + ref);
    var appstore = 'https://apps.apple.com/app/planur/id' + APPSTORE_ID;

    document.getElementById('play').href = play;
    document.getElementById('appstore').href = appstore;

    var ua = navigator.userAgent || navigator.vendor || '';
    var isAndroid = /android/i.test(ua);
    var isIOS = /iphone|ipad|ipod/i.test(ua);
    var idReady = APPSTORE_ID && APPSTORE_ID.indexOf('{{') === -1;

    // Redirect mobile visitors to their store; desktop stays on the buttons page.
    if (isAndroid) {
      location.replace(play);
    } else if (isIOS && idReady) {
      location.replace(appstore);
    }
  })();
</script>
</body>
</html>
